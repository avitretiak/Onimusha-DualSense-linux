name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake libhidapi-dev

      - name: Install LLVM-MinGW
        run: |
          curl --fail --location --retry 3 \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/llvm-mingw-20260908-msvcrt-ubuntu-22.04-x86_64.tar.xz \
            --output "$RUNNER_TEMP/llvm-mingw.tar.xz"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          echo "LLVM_MINGW=$RUNNER_TEMP/llvm-mingw-20260908-msvcrt-ubuntu-22.04-x86_64" >> "$GITHUB_ENV"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Windows REFramework plug-in
        run: |
          cmake -S native/reframework -B "$RUNNER_TEMP/reframework" \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_CXX_COMPILER="$LLVM_MINGW/bin/x86_64-w64-mingw32-clang++" \
            -DREF_INCLUDE_DIR="$GITHUB_WORKSPACE/native/reframework" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/reframework" --config Release
      - name: Build Linux HID relay
        run: |
          cmake -S native/hidrelay -B "$RUNNER_TEMP/hidrelay" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/hidrelay" --config Release

      - name: Publish asset generator
        run: |
          dotnet restore OnimushaDualSense/OnimushaDualSense.csproj \
            --configfile NuGet.Config -r linux-x64
          dotnet publish OnimushaDualSense/OnimushaDualSense.csproj \
            -c Release -r linux-x64 --self-contained false --no-restore \
            -o "$RUNNER_TEMP/asset-generator"

      - name: Assemble release ZIP
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag must look like vX.Y.Z: $TAG" >&2; exit 1 ;;
          esac
          version="${TAG#v}"
          python3 tools/package-release.py \
            --native-plugin-path "$RUNNER_TEMP/reframework/reframework/plugins/OnimushaDualSense.dll" \
            --native-helper-path "$RUNNER_TEMP/hidrelay/onimusha_hidrelay" \
            --generator-directory "$RUNNER_TEMP/asset-generator" \
            --output-directory "$RUNNER_TEMP/release" \
            --archive "$RUNNER_TEMP/Onimusha-DualSense-Linux-${TAG}.zip" \
            --nexus-source-archive "$RUNNER_TEMP/Onimusha-DualSense-Linux-Nexus-source-${TAG}.zip" \
            --runtime-archive "$RUNNER_TEMP/Onimusha-DualSense-Linux-runtimes-${TAG}.zip" \
            --version "$version"
          cp "$RUNNER_TEMP/Onimusha-DualSense-Linux-${TAG}.zip" "$RUNNER_TEMP/Onimusha-DualSense-Linux-latest.zip"
          cp "$RUNNER_TEMP/Onimusha-DualSense-Linux-runtimes-${TAG}.zip" "$RUNNER_TEMP/Onimusha-DualSense-Linux-runtimes-latest.zip"
          python3 - "$RUNNER_TEMP/release" "$RUNNER_TEMP/Onimusha-DualSense-Linux-${TAG}.zip" "$RUNNER_TEMP/Onimusha-DualSense-Linux-Nexus-source-${TAG}.zip" "$RUNNER_TEMP/Onimusha-DualSense-Linux-runtimes-${TAG}.zip" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          stage = Path(sys.argv[1])
          full, nexus_source, runtimes = map(Path, sys.argv[2:])
          expected_full = {
              "LICENSE",
              "RELEASE-METADATA.json",
              "THIRD_PARTY_NOTICES.txt",
              "asset-generator/OnimushaDualSense.deps.json",
              "asset-generator/OnimushaDualSense.dll",
              "asset-generator/OnimushaDualSense.runtimeconfig.json",
              "asset-generator/defense_haptics.json",
              "onimusha_hidrelay",
              "prepare-assets.sh",
              "reframework/data/OnimushaDualSense.ini",
              "reframework/plugins/OnimushaDualSense.dll",
              "reframework/plugins/libportaudio64bit.dll",
              "start-hidrelay.sh",
              "steam-launch.sh",
          }
          staged = {path.relative_to(stage).as_posix() for path in stage.rglob("*") if path.is_file()}
          assert staged == expected_full, sorted(staged ^ expected_full)
          with zipfile.ZipFile(full) as package:
              assert package.namelist() == sorted(expected_full)

          with zipfile.ZipFile(nexus_source) as package:
              names = package.namelist()
              prefix = "Onimusha-DualSense-Linux-source/"
              assert names and all(name.startswith(prefix) for name in names)
              assert prefix + "README.md" in names
              assert prefix + "native/reframework/OnimushaDualSense.cpp" in names
              assert prefix + "distribution/OnimushaDualSense.ini" in names
              assert all(
                  Path(name).suffix.lower() not in {
                      ".a", ".bin", ".dll", ".dylib", ".exe", ".flac", ".lib", ".mp3",
                      ".o", ".obj", ".pak", ".so", ".wav", ".zip", ".7z", ".bat",
                      ".cmd", ".ps1", ".vbs", ".lnk", ".msi", ".sh",
                  }
                  for name in names
              )
              notice = package.read(prefix + "distribution/NEXUS-README.txt").decode()
              assert "Onimusha-DualSense-Linux-runtimes-latest.zip" in notice
              assert "Onimusha-DualSense-Linux-latest.zip" in notice
              assert "Build prerequisites" in notice

          expected_runtime = {
              "LICENSE",
              "RELEASE-METADATA.json",
              "THIRD_PARTY_NOTICES.txt",
              "asset-generator/OnimushaDualSense.deps.json",
              "asset-generator/OnimushaDualSense.dll",
              "asset-generator/OnimushaDualSense.runtimeconfig.json",
              "asset-generator/defense_haptics.json",
              "onimusha_hidrelay",
              "reframework/data/OnimushaDualSense.ini",
              "reframework/plugins/OnimushaDualSense.dll",
              "reframework/plugins/libportaudio64bit.dll",
          }
          with zipfile.ZipFile(runtimes) as package:
              assert package.namelist() == sorted(expected_runtime)
          assert not any(path.suffix.lower() in {".exe", ".cmd", ".bat", ".ps1"} for path in stage.rglob("*"))
          assert not (stage / "SHA256SUMS.txt").exists()
          PY

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="$RUNNER_TEMP/Onimusha-DualSense-Linux-${TAG}.zip"
          latest="$RUNNER_TEMP/Onimusha-DualSense-Linux-latest.zip"
          nexus_source="$RUNNER_TEMP/Onimusha-DualSense-Linux-Nexus-source-${TAG}.zip"
          runtimes="$RUNNER_TEMP/Onimusha-DualSense-Linux-runtimes-${TAG}.zip"
          runtimes_latest="$RUNNER_TEMP/Onimusha-DualSense-Linux-runtimes-latest.zip"
          gh release delete-asset "$TAG" "OnimushaDualSense-${TAG}.zip" --yes 2>/dev/null || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Onimusha-DualSense-Linux ${TAG}"
            gh release upload "$TAG" "$archive" "$latest" "$nexus_source" "$runtimes" "$runtimes_latest" --clobber
          else
            gh release create "$TAG" "$archive" "$latest" "$nexus_source" "$runtimes" "$runtimes_latest" \
              --verify-tag \
              --title "Onimusha-DualSense-Linux ${TAG}" \
              --generate-notes
          fi
