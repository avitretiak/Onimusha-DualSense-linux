name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake libhidapi-dev

      - name: Install LLVM-MinGW
        run: |
          curl --fail --location --retry 3 \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/llvm-mingw-20260908-msvcrt-ubuntu-22.04-x86_64.tar.xz \
            --output "$RUNNER_TEMP/llvm-mingw.tar.xz"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          echo "LLVM_MINGW=$RUNNER_TEMP/llvm-mingw-20260908-msvcrt-ubuntu-22.04-x86_64" >> "$GITHUB_ENV"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Windows REFramework plug-in
        run: |
          cmake -S native/reframework -B "$RUNNER_TEMP/reframework" \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_CXX_COMPILER="$LLVM_MINGW/bin/x86_64-w64-mingw32-clang++" \
            -DREF_INCLUDE_DIR="$GITHUB_WORKSPACE/native/reframework" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/reframework" --config Release
      - name: Build Linux HID relay
        run: |
          cmake -S native/hidrelay -B "$RUNNER_TEMP/hidrelay" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/hidrelay" --config Release

      - name: Publish asset generator
        run: |
          dotnet restore OnimushaDualSense/OnimushaDualSense.csproj \
            --configfile NuGet.Config -r linux-x64
          dotnet publish OnimushaDualSense/OnimushaDualSense.csproj \
            -c Release -r linux-x64 --self-contained false --no-restore \
            -o "$RUNNER_TEMP/asset-generator"

      - name: Assemble release ZIP
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag must look like vX.Y.Z: $TAG" >&2; exit 1 ;;
          esac
          version="${TAG#v}"
          archive="$RUNNER_TEMP/Onimusha-DualSense-Linux-${TAG}.zip"
          python3 tools/package-release.py \
            --native-plugin-path "$RUNNER_TEMP/reframework/reframework/plugins/OnimushaDualSense.dll" \
            --native-helper-path "$RUNNER_TEMP/hidrelay/onimusha_hidrelay" \
            --generator-directory "$RUNNER_TEMP/asset-generator" \
            --output-directory "$RUNNER_TEMP/release" \
            --archive "$archive" \
            --version "$version"
          python3 - "$RUNNER_TEMP/release" "$archive" "$version" <<'PY'
          import json
          from pathlib import Path
          import sys
          import zipfile

          stage, archive, version = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3]
          expected = {
              "LICENSE",
              "RELEASE-METADATA.json",
              "THIRD_PARTY_NOTICES.txt",
              "asset-generator/OnimushaDualSense.deps.json",
              "asset-generator/OnimushaDualSense.dll",
              "asset-generator/OnimushaDualSense.runtimeconfig.json",
              "asset-generator/defense_haptics.json",
              "onimusha_hidrelay",
              "prepare-assets.sh",
              "reframework/data/OnimushaDualSense.ini",
              "reframework/plugins/OnimushaDualSense.dll",
              "reframework/plugins/libportaudio64bit.dll",
              "start-hidrelay.sh",
              "steam-launch.sh",
          }
          staged = {path.relative_to(stage).as_posix() for path in stage.rglob("*") if path.is_file()}
          assert staged == expected, sorted(staged ^ expected)
          with zipfile.ZipFile(archive) as package:
              assert package.namelist() == sorted(expected)
              assert package.testzip() is None
              metadata = json.loads(package.read("RELEASE-METADATA.json"))
              assert metadata["version"] == version
          PY

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="$RUNNER_TEMP/Onimusha-DualSense-Linux-${TAG}.zip"
          archive_name="Onimusha-DualSense-Linux-${TAG}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Onimusha-DualSense-Linux ${TAG}"
            existing_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              [ "$asset" = "$archive_name" ] || gh release delete-asset "$TAG" "$asset" --yes
            done <<< "$existing_assets"
            gh release upload "$TAG" "$archive" --clobber
          else
            gh release create "$TAG" "$archive" \
              --verify-tag \
              --title "Onimusha-DualSense-Linux ${TAG}" \
              --generate-notes
          fi

      - name: Remove unversioned -latest ZIP aliases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_ids="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].assets[]? | select(.name | endswith("-latest.zip")) | .id')"
          while IFS= read -r asset_id; do
            [ -n "$asset_id" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done <<< "$asset_ids"

