; Read once when the game starts. Restart the game after changing this file.
; Booleans accept true/false, yes/no, on/off, or 1/0.
; Strength values are linear multipliers from 0.0 (off) to 1.0 (full).

[General]
; Master switch and multiplier for all mod haptic and trigger output.
Enabled=true
MasterStrength=1.0
; Footsteps scales sound-derived footsteps and walk events.
; RunningFootsteps scales run events.
Footsteps=0.5
RunningFootsteps=0.5

[SoundHaptics]
; Sound-derived haptics by source family. Set a family to 0.0 to disable it.
Enabled=true
UI=1.0
Attack=1.0
Cut=1.0
Guard=1.0
Deflect=1.0
Parry=1.0
Other=1.0

[EventHaptics]
; Action-event gains; 0.0 disables an event. Separate from SoundHaptics.
Enabled=true
FootLeft=1.0
FootRight=1.0
RunLeft=1.0
RunRight=1.0
Attack=1.0
Hit=1.0
Damage=1.0
Guard=1.0
Dodge=1.0
PerfectDodge=1.0
Land=1.0
Heal=1.0
Soul=1.0
Pickup=1.0
LockOn=1.0
Power=1.0
Finisher=1.0
UiSelect=1.0
UiDecide=1.0
UiCancel=1.0
BowStart=1.0

[AdaptiveTriggers]
; Individual trigger switches: bow/R2, Rift/L2, gauntlet/L2, and Soul/L2.
Enabled=true
BowEnabled=true
RiftEnabled=true
GauntletEnabled=true
SoulEnabled=true
; Strength scales enabled profiles; RiftStrength and SoulStrength add per-profile gains.
Strength=1.0
RiftStrength=1.0
SoulStrength=1.0
